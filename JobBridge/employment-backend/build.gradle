plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.employment'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'net.nurigo:sdk:4.3.2'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // System properties outrank developer environment variables and local config.
    systemProperty 'spring.datasource.url', 'jdbc:h2:mem:employment-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1'
    systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
    systemProperty 'spring.datasource.username', 'sa'
    systemProperty 'spring.datasource.password', ''
    systemProperty 'spring.datasource.hikari.connection-init-sql', "SET TIME ZONE 'UTC'"
    systemProperty 'spring.config.import', ''
    systemProperty 'spring.profiles.active', 'test'
}


tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Only a deliberately named disposable loopback database may be used here.
tasks.register('mariaDbTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    doFirst {
        def url = System.getenv('JOBBRIDGE_TEST_MARIADB_URL') ?: ''
        if (!(url ==~ /jdbc:mariadb:\/\/127\.0\.0\.1:\d+\/jobbridge_regression_[a-f0-9]+/))
            throw new GradleException('An explicit disposable loopback test URL is required')
        systemProperty 'spring.datasource.url', url
    }
    systemProperty 'spring.datasource.driver-class-name', 'org.mariadb.jdbc.Driver'
    systemProperty 'spring.datasource.username', 'root'
    systemProperty 'spring.datasource.password', ''
    systemProperty 'spring.datasource.hikari.connection-init-sql', "SET time_zone = '+00:00'"
    systemProperty 'spring.sql.init.mode', 'always'
    systemProperty 'spring.sql.init.schema-locations', 'classpath:db/schema.sql'
    systemProperty 'spring.sql.init.data-locations', 'classpath:db/reference-data.sql'
    systemProperty 'spring.config.import', ''
    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'user.timezone', 'Asia/Seoul'
}
