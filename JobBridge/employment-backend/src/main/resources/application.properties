spring.application.name=Employment

# 서버 포트 및 에러 설정
server.port=8080
server.error.include-message=never

# 환경변수 파일 임포트 경로
spring.config.import=optional:file:../.env.example[.properties],optional:file:./.env.example[.properties],optional:file:./.env[.properties],optional:file:./employment-backend/.env[.properties],optional:file:./.env.local[.properties],optional:file:./employment-backend/.env.local[.properties]

# SQL 및 초기화 설정
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# MariaDB 커넥션 설정
spring.datasource.hikari.connection-init-sql=SET time_zone = '+09:00'

# JPA 설정
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

