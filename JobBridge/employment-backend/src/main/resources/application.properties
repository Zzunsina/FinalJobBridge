spring.application.name=Employment

# MariaDB 연결
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
#spring.flyway.enabled=true
#spring.flyway.validate-on-migrate=true
#spring.flyway.clean-disabled=true
#spring.flyway.baseline-on-migrate=false
#spring.flyway.out-of-order=false

# 서버
server.port=8080
server.error.include-message=never

# 인증
app.jwt-secret=${JWT_SECRET}
app.secure-cookie=false
app.seed-password=${DEV_SEED_PASSWORD:}

# SOLAPI SMS: configure these in the backend process environment.
coolsms.api-key=${COOLSMS_API_KEY:${COOLSMS_APIKEY:}}
coolsms.api-secret=${COOLSMS_API_SECRET:${COOLSMS_APISECRET:}}
coolsms.sender-number=${COOLSMS_SENDER_NUMBER:${COOLSMS_SENDERNUMBER:}}

# Local SMS credentials are optional and never committed. Supports backend/project working directories.
spring.config.import=optional:file:./.env[.properties],optional:file:./employment-backend/.env[.properties],optional:file:./.env.local[.properties],optional:file:./employment-backend/.env.local[.properties]
