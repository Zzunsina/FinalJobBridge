# Explicit, one-time setup for the four new business tables on an existing database.
# No seed/reference data, renames, drops, history tracking, or index changes.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/feature-tables.sql
spring.sql.init.data-locations=
spring.sql.init.encoding=UTF-8
# Prevent dev-profile demo seeding during a schema-only setup run.
app.seed-password=
