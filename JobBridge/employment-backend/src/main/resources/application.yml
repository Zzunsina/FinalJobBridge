spring:
  datasource:
    url: jdbc:mariadb://192.168.0.19:3306/employment_db
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: "1111"
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  config:
    activate:
      on-profile: dev

coolsms:
  api-key: ${COOLSMS_APIKEY}
  api-secret: ${COOLSMS_APISECRET}
  sender-number: ${COOLSMS_SENDERNUMBER} # 솔라피에 등록된 발신번호

server:
  error:
    include-message: never

app:
  jwt-secret: ${JWT_SECRET}
  secure-cookie: false
  seed-password: ${DEV_SEED_PASSWORD:}
