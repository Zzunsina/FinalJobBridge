spring.datasource.url=jdbc:h2:mem:employment-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.hibernate.ddl-auto=validate
app.jwt-secret=test-only-secret-at-least-thirty-two-characters-long
app.secure-cookie=false
app.seed-password=

# Never import developer credentials or enable seed data in tests.
spring.config.import=
spring.profiles.active=test
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/reference-data.sql


spring.sql.init.encoding=UTF-8
